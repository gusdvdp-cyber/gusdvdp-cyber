<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Seis pilares: IA aplicada, integración de sistemas, ingeniería de datos, ingeniería de software, infraestructura e inteligencia de negocio">
  <defs>
