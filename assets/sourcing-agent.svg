<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Agente autónomo de sourcing: formulario, búsqueda en Alibaba, chats multicuenta, negociación con IA y cotizaciones en ~24 h">
  <defs>
    <style>
      .sans { font-family: 'Manrope', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .node rect { fill: #0E0E0D; stroke: #2A2926; stroke-width: 1.5; animation: lit 10s linear infinite; }
      .n2 rect { animation-delay: 2s; } .n3 rect { animation-delay: 4s; } .n4 rect { animation-delay: 6s; } .n5 rect { animation-delay: 8s; }
      @keyframes lit { 0%,20%,100% { stroke: #2A2926; } 2%,16% { stroke: #F06A1F; } }
      .num { animation: litnum 10s linear infinite; }
      .n2 .num { animation-delay: 2s; } .n3 .num { animation-delay: 4s; } .n4 .num { animation-delay: 6s; } .n5 .num { animation-delay: 8s; }
      @keyframes litnum { 0%,20%,100% { fill: #77736D; } 2%,16% { fill: #F06A1F; } }
      .flow { stroke-dasharray: 6 8; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
    </style>
  </defs>

  <rect width="1200" height="330" fill="#000"/>
  <text x="24" y="34" class="mono" font-size="13" letter-spacing="4" fill="#77736D">AGENTE AUTÓNOMO DE SOURCING · SLS GLOBAL</text>

  <path id="track" d="M128 206 H1072" fill="none" stroke="#2A2926" stroke-width="2"/>
  <path d="M128 206 H1072" fill="none" stroke="#F06A1F" stroke-opacity="0.45" stroke-width="2" class="flow"/>
  <g stroke="#2A2926" stroke-width="2">
    <line x1="128" y1="190" x2="128" y2="206"/><line x1="364" y1="190" x2="364" y2="206"/><line x1="600" y1="190" x2="600" y2="206"/><line x1="836" y1="190" x2="836" y2="206"/><line x1="1072" y1="190" x2="1072" y2="206"/>
  </g>

  <g class="node n1" transform="translate(24 70)">
    <rect width="208" height="120" rx="4"/>
    <text x="18" y="34" class="mono num" font-size="13">01</text>
    <text x="18" y="66" class="sans" font-size="20" font-weight="800" fill="#ECEAE6">Formulario</text>
    <text x="18" y="94" class="mono" font-size="12" fill="#77736D">producto · imagen</text>
    <text x="18" y="110" class="mono" font-size="12" fill="#77736D">requisitos obligatorios</text>
  </g>
  <g class="node n2" transform="translate(260 70)">
    <rect width="208" height="120" rx="4"/>
    <text x="18" y="34" class="mono num" font-size="13">02</text>
    <text x="18" y="66" class="sans" font-size="20" font-weight="800" fill="#ECEAE6">Búsqueda</text>
    <text x="18" y="94" class="mono" font-size="12" fill="#77736D">scraping en Alibaba</text>
    <text x="18" y="110" class="mono" font-size="12" fill="#77736D">solo verificados</text>
  </g>
  <g class="node n3" transform="translate(496 70)">
    <rect width="208" height="120" rx="4"/>
    <text x="18" y="34" class="mono num" font-size="13">03</text>
    <text x="18" y="66" class="sans" font-size="20" font-weight="800" fill="#ECEAE6">Chats</text>
    <text x="18" y="94" class="mono" font-size="12" fill="#77736D">multicuenta en paralelo</text>
    <text x="18" y="110" class="mono" font-size="12" fill="#77736D">SDK + WebSockets</text>
  </g>
  <g class="node n4" transform="translate(732 70)">
    <rect width="208" height="120" rx="4"/>
    <text x="18" y="34" class="mono num" font-size="13">04</text>
    <text x="18" y="66" class="sans" font-size="20" font-weight="800" fill="#ECEAE6">Negociación IA</text>
    <text x="18" y="94" class="mono" font-size="12" fill="#77736D">FOB · MOQ · CBM</text>
    <text x="18" y="110" class="mono" font-size="12" fill="#77736D">contraofertas · PDF</text>
  </g>
  <g class="node n5" transform="translate(968 70)">
    <rect width="208" height="120" rx="4"/>
    <text x="18" y="34" class="mono num" font-size="13">05</text>
    <text x="18" y="66" class="sans" font-size="20" font-weight="800" fill="#ECEAE6">Cotizaciones</text>
    <text x="18" y="94" class="mono" font-size="12" fill="#77736D">cierre automático</text>
    <text x="18" y="110" class="mono" font-size="12" fill="#77736D">ranking de proveedores</text>
  </g>

  <circle r="6" fill="#F06A1F">
    <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1" keyTimes="0;0.12;0.2;0.32;0.4;0.52;0.6;0.72;0.8;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
  </circle>

  <g transform="translate(24 222)">
    <g transform="translate(0 22)">
      <text x="0" y="34" class="sans" font-size="34" font-weight="800" fill="#F06A1F">~24 h</text>
      <text x="0" y="62" class="mono" font-size="12" fill="#77736D">del pedido a la cotización</text>
    </g>
    <g transform="translate(300 22)">
      <text x="0" y="34" class="sans" font-size="34" font-weight="800" fill="#F06A1F">≈5 personas</text>
      <text x="0" y="62" class="mono" font-size="12" fill="#77736D">de trabajo manual reemplazado</text>
    </g>
    <g transform="translate(600 22)">
      <text x="0" y="34" class="sans" font-size="34" font-weight="800" fill="#F06A1F">-80%</text>
      <text x="0" y="62" class="mono" font-size="12" fill="#77736D">de costo mensual de IA</text>
    </g>
    <g transform="translate(900 22)">
      <text x="0" y="34" class="sans" font-size="34" font-weight="800" fill="#F06A1F">24/7</text>
      <text x="0" y="62" class="mono" font-size="12" fill="#77736D">negociando sin intervención</text>
    </g>
  </g>
</svg>
